# KataGo analysis engine config (CPU / Eigen, Docker)
# CPU 전용 튜닝: 19x19 고정, PV·오너십 축소, 루트 노이즈 off.
# visits는 요청별로 넘기므로 여기 maxVisits는 상한 안전망.

reportAnalysisWinratesAs = SIDETOMOVE

# b18c384nbt-humanv0을 주 모델로 쓸 때 필수. 쿼리별 overrideSettings로 덮어쓸 수 있다.
humanSLProfile = preaz_5k
logFile = /tmp/katago_analysis.log
logAllGTPCommunication = false

# 요청별로 넘긴 maxVisits가 우선. 상한만 두어 폭주 방지.
maxVisits = 128

# 사범 응답(질문)에서 응수 수순은 3수면 충분. 기본 15는 CPU에서 낭비.
analysisPVLen = 5

# 분석 전용이므로 루트 와이드 노이즈 off → 상위 수 집중 탐색 → 같은 visits로 더 정확.
wideRootNoise = 0.0

# 보드 크기 고정 → NN 버퍼 크기 최적화.
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = true

# CPU에서는 포지션 1개를 집중 탐색이 유리 (분석 1 × 검색 N 패턴).
# 수담은 "하나의 포지션에 대한 응답 지연"이 중요한 사용 패턴이라 batch보다 latency 우선.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4
nnMaxBatchSize = 4
# 컨테이너 CPU 16코어 기준. 기본값은 min(analysisThreads×searchThreads, cores)=4이지만
# Eigen 행렬 연산은 코어를 더 쓸수록 NN forward pass가 빨라진다 (2-3x 기대).
numEigenThreadsPerModel = 12

# 트랜스포지션 캐시: 같은 포지션 재방문 비용 절감 (2^22 ≈ 4M 엔트리).
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 16

# 심볼메트리 가지치기 → 초반 포지션 탐색 효율 ↑.
rootSymmetryPruning = true
