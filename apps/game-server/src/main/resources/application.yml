spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sudam}
    username: ${SPRING_DATASOURCE_USERNAME:sudam}
    password: ${SPRING_DATASOURCE_PASSWORD:sudam_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
