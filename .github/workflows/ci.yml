name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-core:
    name: go-core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go-core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -v

  analysis:
    name: analysis tests
    runs-on: ubuntu-latest
    needs: go-core
    defaults:
      run:
        working-directory: packages/analysis
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Tests
        run: uv run pytest -v

  engine-pool:
    name: engine-pool tests (mock)
    runs-on: ubuntu-latest
    needs: go-core
    env:
      KATAGO_MOCK: "true"
    defaults:
      run:
        working-directory: packages/engine-pool
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Tests (mock engine)
        run: uv run pytest -v -m "not engine"

  verifier:
    name: verifier tests
    runs-on: ubuntu-latest
    needs: go-core
    defaults:
      run:
        working-directory: packages/verifier
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Tests
        run: uv run pytest -v

  ai-service:
    name: ai-service tests
    runs-on: ubuntu-latest
    needs: [go-core, analysis]
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Tests
        run: uv run pytest -v

  eval-small:
    name: Small eval (S0 pilot)
    runs-on: ubuntu-latest
    needs: [go-core, engine-pool]
    env:
      KATAGO_MOCK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Run S0 eval (mock)
        run: |
          cd eval
          uv run --with "$(cat requirements.txt 2>/dev/null || echo '')" python experiments/s0_pilot.py --ci
        continue-on-error: true
