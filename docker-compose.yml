services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sudam}
      POSTGRES_USER: ${POSTGRES_USER:-sudam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sudam_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sudam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-server:
    build:
      context: ./apps/game-server
      dockerfile: Dockerfile
    ports:
      - "${GAME_SERVER_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sudam}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sudam}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sudam_dev}
      AI_SERVICE_URL: http://ai-service:${AI_SERVICE_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      KATAGO_BINARY: katago
      KATAGO_MODEL: ${KATAGO_MODEL:-}
      KATAGO_HUMAN_MODEL: ${KATAGO_HUMAN_MODEL:-}
      KATAGO_CONFIG: /app/katago_analysis.cfg
      KATAGO_MOCK: ${KATAGO_MOCK:-true}
      KATAGO_MAX_VISITS: ${KATAGO_MAX_VISITS:-4}
      KATAGO_QUESTION_VISITS: ${KATAGO_QUESTION_VISITS:-32}
      KATAGO_TIMEOUT: ${KATAGO_TIMEOUT:-60}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sudam}:${POSTGRES_PASSWORD:-sudam_dev}@db:5432/${POSTGRES_DB:-sudam}
    volumes:
      - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_GAME_SERVER_URL: http://localhost:${GAME_SERVER_PORT:-8080}
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:${AI_SERVICE_PORT:-8000}
    depends_on:
      game-server:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  pgdata:
